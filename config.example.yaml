# ============ 舰长礼物系统 配置文件 ============
# 首次使用：把本文件复制一份，改名为 config.yaml，再修改下面的内容

streamer:
  name: "你的B站昵称"          # 主播昵称
  room_id: 123456              # 直播间号（短号/长号都可以）
  # 截图里必须出现以下任意一个关键词，才认为是“你直播间”的截图（一般填主播昵称、粉丝牌名称）
  keywords: ["你的B站昵称", "粉丝牌名"]

bilibili:
  # 是否调用 B站 公开接口拉取当前舰长列表做交叉校验（推荐开启，可防止P图）
  check_api: true

qq:
  groups: [123456789]          # 舰长群群号（可以多个）
  admins: [10001]              # 主播/管理员 QQ（可以用管理命令）
  # 新人进群后多少分钟内未通过验证则踢出，0 = 不踢
  kick_unverified_minutes: 0

web:
  # 观众填写地址时打开的网址。只在本机测试就用 127.0.0.1；
  # 放到云服务器上请改成 http://服务器公网IP:8765 或你的域名
  public_url: "http://127.0.0.1:8765"
  admin_password: "请改成一个复杂的密码"
  link_valid_hours: 24         # 填写链接的有效时间

rules:
  # 每月前几天里，仍允许“上个月”的舰长修改地址（0 = 只允许当月舰长修改）
  edit_grace_days: 0
